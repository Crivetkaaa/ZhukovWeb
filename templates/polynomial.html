<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuck Zhukov</title>


    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --input-bg: #0f172a;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
        }

        .container {
            width: 90%;
            max-width: 700px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        .settings {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        label {
            color: var(--text-secondary);
        }

        input {
            width: 250px;
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #0f172a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            align-self: flex-end;
        }

        button:hover {
            opacity: 0.85;
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            background: var(--card-bg);
            border-radius: 12px;
            text-align: left;
            border: 1px solid #334155;
        }

        .result h2 {
            margin-top: 0;
            text-align: center;
        }

        .result pre {
            margin: 0;
            padding: 15px;
            background: var(--input-bg);
            border-radius: 8px;
            white-space: pre-wrap;
            overflow-x: auto;
            color: var(--text-main);
            font-family: monospace;
            line-height: 1.6;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            .settings {
                flex-direction: column;
                align-items: center;
            }

            .field {
                width: 100%;
                max-width: 300px;
            }

            input {
                width: 100%;
            }

            button {
                align-self: center;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Деление многочленов</h1>

        <p class="description">
            Введите делимое и делитель в двоичном виде
        </p>

        <div class="settings">
            <div class="field">
                <label for="dividend">Делимое</label>
                <input
                    id="dividend"
                    type="text"
                    inputmode="numeric"
                    pattern="[01]+"
                    placeholder="Например: 101101"
                >
            </div>

            <div class="field">
                <label for="divisor">Делитель</label>
                <input
                    id="divisor"
                    type="text"
                    inputmode="numeric"
                    pattern="[01]+"
                    placeholder="Например: 101"
                >
            </div>

            <button onclick="solve()">Разделить</button>
        </div>

        <div id="result" class="result hidden">
            <h2>Результат</h2>
            <pre id="resultText"></pre>
        </div>
    </main>

    <script>
        async function solve() {
            const dividend = document.getElementById("dividend").value.trim();
            const divisor = document.getElementById("divisor").value.trim();

            if (!dividend || !divisor) {
                alert("Введите делимое и делитель");
                return;
            }

            if (!/^[01]+$/.test(dividend) || !/^[01]+$/.test(divisor)) {
                alert("Можно вводить только 0 и 1");
                return;
            }

            const data = {
                dividend: dividend,
                divisor: divisor
            };

            try {
                const response = await fetch("/polynomial", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok) {
                    alert(result.error || "Ошибка при делении");
                    return;
                }

                document.getElementById("resultText").textContent = result.result;
                document.getElementById("result").classList.remove("hidden");
            } catch (error) {
                alert("Ошибка соединения с сервером");
            }
        }
    </script>
</body>
</html>
