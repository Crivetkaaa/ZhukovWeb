<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuck Zhukov</title>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #273449;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --input-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-color);
            color: var(--text-main);
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 30px;
        }

        .card {
            padding: 30px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid #334155;
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #0f172a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: var(--input-bg);
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .result h2 {
            margin-top: 0;
        }

        #resultText {
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">
        <h1>Калькулятор</h1>

        <div class="input-group">
            <label for="a">Регистор 0</label>
            <input id="reg_0" placeholder="10110">
        </div>

        <div class="input-group">
            <label for="a">Начальное заполнение регистра 0</label>
            <input id="reg_0_start" placeholder="1011">
        </div>

        <div class="input-group">
            <label for="a">Регистор 1</label>
            <input id="reg_1" placeholder="10110">
        </div>

        <div class="input-group">
            <label for="a">Начальное заполнение регистра 1</label>
            <input id="reg_1_start" placeholder="1011">
        </div>

        <div class="input-group">
            <label for="a">Управляющий регистр</label>
            <input id="result_reg" placeholder="11111">
        </div>

        <div class="input-group">
            <label for="a">Начальное заполнение результирующего регистра</label>
            <input id="result_reg_start" placeholder="1011">
        </div>


        <div class="input-group">
            <label for="a">Выходная длина</label>
            <input id="len" placeholder="16" type="number">
        </div>
        
        <div class="input-group">
            <label for="a">Открытый текст</label>
            <input id="open_text" placeholder="1010110101011011" type="text">
        </div>

        <button onclick="calculate()">Рассчитать</button>

        <div id="result" class="result hidden">
            <h2>Результат</h2>
            <div id="resultText"></div>
        </div>
    </div>
</div>

<script>
    async function calculate() {
        const reg_0 = document.getElementById("reg_0").value.trim();
        const reg_1 = document.getElementById("reg_1").value.trim();
        const result_reg = document.getElementById("result_reg").value.trim();

        const reg_0_start = document.getElementById("reg_0_start").value.trim();
        const reg_1_start = document.getElementById("reg_1_start").value.trim();
        const result_reg_start = document.getElementById("result_reg_start").value.trim();

        const len = parseInt(document.getElementById("len").value.trim(), 10);
        const open_text = document.getElementById("open_text").value.trim();
        if (
            !reg_0 ||
            !reg_1 ||
            !result_reg ||
            !reg_0_start ||
            !reg_1_start ||
            !result_reg_start ||
            !Number.isInteger(len) ||
            len <= 0 ||
            !open_text
        ) {
            alert("Заполните все поля корректно");
            return;
        }

        const response = await fetch("/gefe", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                registers: [reg_0, reg_1, result_reg],
                start_values: [reg_0_start, reg_1_start, result_reg_start],
                len: len,
                open_text: open_text
            })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.error || "Ошибка");
            return;
        }

        document.getElementById("resultText").textContent = data.result;
        document.getElementById("result").classList.remove("hidden");
    }
</script>

</body>
</html>
