<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuck Zhukov</title>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #273449;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --input-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-color);
            color: var(--text-main);
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 600px;
            min-width: 0;
            padding: 30px;
        }

        .card {
            width: 100%;
            min-width: 0;
            padding: 30px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid #334155;
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
            min-width: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        input {
            display: block;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            display: block;
            width: 100%;
            max-width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #0f172a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .result {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            margin-top: 25px;
            padding: 20px;
            background: var(--input-bg);
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .result h2 {
            margin-top: 0;
        }

        #resultText {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: normal;
            line-height: 1.6;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 12px;
            }

            .card {
                padding: 18px;
            }

            .result {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">
        <h1>Калькулятор</h1>

        <div class="input-group">
            <label for="a">Многочлен</label>
            <input
                id="a"
                type="text"
                placeholder="10101101"
                autocomplete="off"
            >
        </div>

        <button onclick="calculate()">Рассчитать</button>

        <div id="result" class="result hidden">
            <h2>Результат</h2>
            <div id="resultText"></div>
        </div>
    </div>
</div>

<script>
    async function calculate() {
        const a = document.getElementById("a").value.trim();

        if (!a) {
            alert("Поле не может быть пустым");
            return;
        }

        if (!/^[01]+$/.test(a)) {
            alert("Многочлен должен содержать только 0 и 1");
            return;
        }

        try {
            const response = await fetch("/prim_mnogochlen", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ a: a })
            });

            const data = await response.json();

            if (!response.ok) {
                alert(data.error || "Ошибка");
                return;
            }

            document.getElementById("resultText").textContent = data.result;
            document.getElementById("result").classList.remove("hidden");

        } catch (error) {
            alert("Не удалось выполнить запрос к серверу");
        }
    }
</script>

</body>
</html>
