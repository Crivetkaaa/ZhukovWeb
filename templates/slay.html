<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuck Zhukov</title>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --input-bg: #0f172a;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        .settings {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        label {
            color: var(--text-secondary);
        }

        input {
            width: 120px;
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #0f172a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .matrix {
            display: grid;
            gap: 8px;
            justify-content: center;
            margin: 30px 0;
        }

        .matrix input {
            width: 80px;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            .settings {
                flex-direction: column;
                align-items: center;
            }
        }
        .result {
    margin-top: 30px;
    padding: 25px;
    background: var(--card-bg);
    border-radius: 12px;
    text-align: left;
    border: 1px solid #334155;
}

.result h2 {
    margin-top: 0;
    text-align: center;
}

.result pre {
    margin: 0;
    white-space: pre-wrap;
    overflow-x: auto;
    color: var(--text-main);
    font-family: monospace;
    line-height: 1.6;
}
    </style>
</head>
<body>
    <main class="container">
        <h1>Ввод матрицы</h1>
        <p class="description">Задайте размер матрицы</p>

        <div class="settings">
            <div class="field">
                <label for="rows">Строки</label>
                <input id="rows" type="number" min="1" value="3">
            </div>

            <div class="field">
                <label for="cols">Столбцы</label>
                <input id="cols" type="number" min="1" value="3">
            </div>

            <div class="field">
                <label for="field">Модуль поля</label>
                <input id="field" type="number" min="1" value="7">
            </div>

            <button onclick="createMatrix()">Создать</button>
        </div>

        <form id="matrixForm" class="hidden">
            <div id="matrix" class="matrix"></div>
            <button type="submit">Решить</button>
        </form>
        <div id="result" class="result hidden">
        <h2>Результат</h2>
        <pre id="resultText"></pre>
    </main>
</div>

    <script>
document.getElementById("matrixForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const rows = Number(document.getElementById("rows").value);
    const cols = Number(document.getElementById("cols").value);
    const field = Number(document.getElementById("field").value);

    const inputs = document.querySelectorAll("#matrix input");
    const matrix = [];

    for (let i = 0; i < rows; i++) {
        const row = [];

        for (let j = 0; j < cols; j++) {
            const index = i * cols + j;
            row.push(Number(inputs[index].value));
        }

        matrix.push(row);
    }

    const data = {
        field: field,
        matrix: matrix
    };

    const response = await fetch("/slay", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    });

    if (!response.ok) {
        alert("Ошибка при отправке матрицы");
        return;
    }

    const result = await response.json();

    document.getElementById("resultText").textContent = result.result;
    document.getElementById("result").classList.remove("hidden");
});

        function createMatrix() {
            const rows = Number(document.getElementById("rows").value);
            const cols = Number(document.getElementById("cols").value);
            const matrix = document.getElementById("matrix");
            const form = document.getElementById("matrixForm");

            if (rows < 1 || cols < 1) {
                return;
            }

            matrix.innerHTML = "";
            matrix.style.gridTemplateColumns = `repeat(${cols}, 80px)`;

            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    const input = document.createElement("input");

                    input.type = "number";
                    input.step = "any";
                    input.name = `a_${i}_${j}`;
                    input.required = true;

                    matrix.appendChild(input);
                }
            }

            form.classList.remove("hidden");
        }

    </script>
</body>
</html>
