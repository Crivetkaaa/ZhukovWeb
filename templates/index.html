<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuck Zhukov</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #273449;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
        }

        .container {
            width: 90%;
            max-width: 1000px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 42px;
        }

        .description {
            margin-bottom: 45px;
            color: var(--text-secondary);
            font-size: 18px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .card {
            padding: 35px 25px;
            background: var(--card-bg);
            border-radius: 16px;
            color: var(--text-main);
            text-decoration: none;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .card:hover {
            transform: translateY(-5px);
            background: var(--card-hover);
            border-color: var(--accent);
        }

        .icon {
            font-size: 42px;
            margin-bottom: 18px;
        }

        .card h2 {
            margin: 0 0 12px;
            font-size: 25px;
        }

        .card p {
            margin: 0;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        @media (max-width: 700px) {
            h1 {
                font-size: 32px;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Калькуляторы и инструменты</h1>
        <p class="description">Выберите задачу, которую хотите решить</p>

        <div class="cards">
            <a href="/slay" class="card">
                <h2>СЛАУ</h2>
            </a>

            <a href="/log" class="card">
                <h2>Логорифмирование</h2>
            </a>

            <a href="/polynomial" class="card">
                <h2>НОД для многочленов</h2>
            </a>
            <a href="/calculate" class="card">
                <h2>НОД для чисел</h2>
            </a>
            <a href="/podstanovka" class="card">
                <h2>Возведение подстановки в степень</h2>
            </a>
            <a href="/podstanovka_count" class="card">
                <h2>Подсчёт подстановок заданного порядка</h2>
            </a>
        </div>
    </main>
</body>
</html>
